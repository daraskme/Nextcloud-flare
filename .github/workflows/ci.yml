name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: local (ubuntu-latest)
            shard: ""
          - os: windows-latest
            name: local (windows-latest, 1/4)
            shard: "1/4"
          - os: windows-latest
            name: local (windows-latest, 2/4)
            shard: "2/4"
          - os: windows-latest
            name: local (windows-latest, 3/4)
            shard: "3/4"
          - os: windows-latest
            name: local (windows-latest, 4/4)
            shard: "4/4"
    runs-on: ${{ matrix.os }}
    # Keep all four integration shards; the full Windows Node suite has its own job.
    # Run 36444362854 spent 8m46s on Node tests before shard 1 hit the 30m limit.
    # Ubuntu still runs every gate; application deadlines and job budgets stay unchanged.
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - if: matrix.shard == ''
        run: pnpm check
      - if: matrix.shard != ''
        run: pnpm lint
      - if: matrix.shard != ''
        run: pnpm typecheck
      - if: matrix.shard != ''
        run: pnpm verify:contracts
      - if: matrix.shard != ''
        run: pnpm verify:config
      - if: matrix.shard != ''
        run: pnpm test:integration --shard=${{ matrix.shard }}
      - if: matrix.shard != ''
        run: pnpm build

  windows-unit:
    name: unit (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  backup:
    name: backup (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        kind: [bindings, cli]
    runs-on: ubuntu-latest
    # Run 36384106965 printed run-drill PASS just before the combined 30m job expired.
    # Give the CLI drill its own runner; all drills keep their assertions and deadlines.
    timeout-minutes: 30
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - if: matrix.kind == 'bindings'
        run: pnpm backup:drill
      - if: matrix.kind == 'bindings'
        run: pnpm backup:operator-drill
      - if: matrix.kind == 'cli'
        run: pnpm backup:run-drill
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backup-failure-${{ matrix.kind }}
          path: |
            .wrangler/backup-drill-*/*.log
            .wrangler/backup-run-drill-*/*.log
            .wrangler/operator-drill-*/report.json
          include-hidden-files: true
          retention-days: 3

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 3

  browser-single-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:single-host
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-single-host-failure
          path: test-results/single-host/
          retention-days: 3
